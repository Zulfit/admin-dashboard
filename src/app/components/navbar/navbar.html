<aside class="flex flex-col w-64 h-screen fixed left-0 top-0 bg-white border-r border-gray-200 shadow-sm z-50">
  <!-- Logo Section -->
  <div class="flex items-center h-16 px-6 border-b border-gray-100">
    <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Admin<span class="text-blue-600">Dash</span></h2>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-4 py-6 overflow-y-auto">
    <p class="px-3 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Menu</p>
    <ul class="flex flex-col gap-1">
      <li>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-blue-700 transition-all duration-200 group">
          <hugeicons-icon [icon]="studentIcon" [size]="24" [strokeWidth]="1.5" color="currentColor" class="text-gray-400 group-hover:text-blue-600 transition-colors"></hugeicons-icon>
          Students
        </a>
      </li>
      <li>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-blue-700 transition-all duration-200 group">
          <hugeicons-icon [icon]="teacherIcon" [size]="24" [strokeWidth]="1.5" color="currentColor" class="text-gray-400 group-hover:text-blue-600 transition-colors"></hugeicons-icon>
          Lecturers
        </a>
      </li>
      <li>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-blue-700 transition-all duration-200 group">
          <hugeicons-icon [icon]="bookIcon" [size]="24" [strokeWidth]="1.5" color="currentColor" class="text-gray-400 group-hover:text-blue-600 transition-colors"></hugeicons-icon>
          Subjects
        </a>
      </li>
    </ul>
  </nav>

  <!-- Optional Bottom Section -->
  <div class="p-4 border-t border-gray-100">
    <div class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors">
      <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">
        A
      </div>
      <div class="flex flex-col">
        <span class="text-sm font-medium text-gray-700">Admin User</span>
        <span class="text-xs text-gray-500">View profile</span>
      </div>
    </div>
  </div>
</aside>
